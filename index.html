  <title>即デコカメラ - ChekiSnap</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    /* ブラウザ全体のスクロール・誤拡大防止 */
    html, body {
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      overflow: hidden;
      background-color: #090d16;
      color: white;
      height: 100%;
      width: 100%;
      position: fixed;
    }

    /* チェキフレーム構造 */
    .cheki-frame {
      background: white;
      color: #1f2937;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      position: relative;
      padding: 12px 12px 48px 12px;
    }
    .cheki-photo-area {
      position: relative;
      width: 100%;
      height: 0;
      padding-bottom: 125%; /* 4:5 比率 */
      background: #000;
      border-radius: 2px;
      overflow: hidden;
    }
    .cheki-photo-content {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* インカメラ鏡像反転 */
    .mirror-mode {
      transform: scaleX(-1);
    }

    /* スタンプ要素スタイル */
    .stamp-element {
      position: absolute;
      font-size: 2.8rem;
      cursor: move;
      touch-action: none;
      transform: translate(-50%, -50%);
      line-height: 1;
      filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.4));
      user-select: none;
      pointer-events: auto;
      z-index: 30;
    }
    .stamp-element.selected {
      outline: 2px dashed #ec4899;
      outline-offset: 4px;
      border-radius: 8px;
      background-color: rgba(236, 72, 153, 0.2);
    }
    .stamp-delete-btn {
      position: absolute;
      top: -12px;
      right: -12px;
      width: 24px;
      height: 24px;
      background-color: #ef4444;
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: bold;
      box-shadow: 0 2px 5px rgba(0,0,0,0.4);
      cursor: pointer;
      z-index: 40;
    }

    .modal-backdrop {
      background-color: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
    }

    #toast-notification {
      transition: opacity 0.3s ease, transform 0.3s ease;
    }
  </style>
</head>

  <!-- JavaScript メインロジック -->
  <script>
    const state = {
      currentFacingMode: 'user',
      flashOn: false,
      timerSec: 0,
      currentPhotoData: null,
      currentPhotoRawID: '',
      currentDateStr: '',
      
      // 描画状態 (pen | eraser | null)
      isDrawing: false,
      currentMode: 'pen',
      currentColor: '#000000',
      penLineWidth: 7,
      eraserLineWidth: 18,
      penSizeLabel: '中',
      eraserSizeLabel: '中',
      
      // スタンプ管理
      stamps: [],
      pendingStampChar: null,
      activeDragStampId: null,
      selectedStampId: null,
      dragOffset: { x: 0, y: 0 },

      // アルバム閲覧状態
      currentActiveTab: 'camera',
      albumItems: [],
      selectedAlbumItem: null,
      viewerMode: 'deco',
      cardViewModes: {}
    };

    const COLOR_PALETTE = [
      { name: '黒', hex: '#000000' },
      { name: '白', hex: '#FFFFFF' },
      { name: '赤', hex: '#EF4444' },
      { name: '青', hex: '#1D4ED8' },
      { name: '黄', hex: '#FFFF00' },
      { name: '紫', hex: '#FF00FF' },
      { name: '緑', hex: '#047857' },
      { name: 'ピンク', hex: '#EC4899' },
      { name: '水色', hex: '#06B6D4' },
      { name: 'オレンジ', hex: '#F97316' }
    ];

    const video = document.getElementById('webcam');
    const photoCanvas = document.getElementById('photo-canvas');
    const drawCanvas = document.getElementById('draw-canvas');
    const photoCtx = photoCanvas.getContext('2d');
    const drawCtx = drawCanvas.getContext('2d');
    const stampLayer = document.getElementById('stamp-layer');

    let db = null;
    function initIndexedDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open('ChekiSnapDB', 1);
        req.onupgradeneeded = (e) => {
          const database = e.target.result;
          if (!database.objectStoreNames.contains('chekis')) {
            database.createObjectStore('chekis', { keyPath: 'id' });
          }
        };
        req.onsuccess = (e) => {
          db = e.target.result;
          resolve(db);
        };
        req.onerror = (e) => reject(e);
      });
    }

    async function saveChekiToDB(item) {
      if (!db) await initIndexedDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction('chekis', 'readwrite');
        const store = tx.objectStore('chekis');
        store.put(item);
        tx.oncomplete = () => resolve();
        tx.onerror = (e) => reject(e);
      });
    }

    async function getAllChekisFromDB() {
      if (!db) await initIndexedDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction('chekis', 'readonly');
        const store = tx.objectStore('chekis');
        const req = store.getAll();
        req.onsuccess = () => resolve(req.result || []);
        req.onerror = (e) => reject(e);
      });
    }

    async function deleteChekiFromDB(id) {
      if (!db) await initIndexedDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction('chekis', 'readwrite');
        const store = tx.objectStore('chekis');
        store.delete(id);
        tx.oncomplete = () => resolve();
        tx.onerror = (e) => reject(e);
      });
    }

    async function generateUniquePhotoID(dateStr) {
      const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
      const existingChekis = await getAllChekisFromDB();
      const existingIDsToday = new Set(
        existingChekis
          .filter(c => c.dateStr === dateStr)
          .map(c => c.photoId)
      );

      let newId = '';
      let attempts = 0;
      do {
        newId = '';
        for (let i = 0; i < 4; i++) {
          newId += chars.charAt(Math.floor(Math.random() * chars.length));
        }
        attempts++;
      } while (existingIDsToday.has(newId) && attempts < 100);

      return newId;
    }

    // --- カメラ制御 ---
    let mediaStream = null;
    async function initCamera() {
      if (mediaStream) {
        mediaStream.getTracks().forEach(track => track.stop());
        mediaStream = null;
      }

      state.flashOn = false;
      updateFlashIconUI();
      updateCameraLabelUI();

      try {
        const constraints = {
          video: {
            facingMode: { exact: state.currentFacingMode },
            width: { ideal: 1280 },
            height: { ideal: 960 }
          },
          audio: false
        };
        mediaStream = await navigator.mediaDevices.getUserMedia(constraints);
      } catch (err) {
        try {
          const fallbackConstraints = {
            video: {
              facingMode: state.currentFacingMode,
              width: { ideal: 1280 },
              height: { ideal: 960 }
            },
            audio: false
          };
          mediaStream = await navigator.mediaDevices.getUserMedia(fallbackConstraints);
        } catch (fallbackErr) {
          console.error("カメラ起動エラー:", fallbackErr);
          return;
        }
      }

      video.srcObject = mediaStream;
      await video.play().catch(e => console.error("Video Play Error:", e));
    }

    function takePhoto() {
      if (state.timerSec > 0) {
        let count = state.timerSec;
        const countdownEl = document.getElementById('timer-countdown');
        countdownEl.innerText = count;
        countdownEl.classList.remove('hidden');
        const timer = setInterval(() => {
          count--;
          if (count > 0) {
            countdownEl.innerText = count;
          } else {
            clearInterval(timer);
            countdownEl.classList.add('hidden');
            captureFrame();
          }
        }, 1000);
      } else {
        captureFrame();
      }
    }

    function captureFrame() {
      const rawTempCanvas = document.createElement('canvas');
      const videoW = video.videoWidth || 640;
      const videoH = video.videoHeight || 480;
      rawTempCanvas.width = videoW;
      rawTempCanvas.height = videoH;
      const rawCtx = rawTempCanvas.getContext('2d');

      if (state.currentFacingMode === 'user') {
        rawCtx.translate(rawTempCanvas.width, 0);
        rawCtx.scale(-1, 1);
      }
      rawCtx.drawImage(video, 0, 0, rawTempCanvas.width, rawTempCanvas.height);

      const frameCanvas = document.createElement('canvas');
      frameCanvas.width = 800;
      frameCanvas.height = 1000;
      const fCtx = frameCanvas.getContext('2d');

      fCtx.fillStyle = '#FFFFFF';
      fCtx.fillRect(0, 0, 800, 1000);

      const photoX = 24, photoY = 24, photoW = 800 - 48, photoH = 1000 - 144;

      const imgRatio = videoW / videoH;
      const targetRatio = photoW / photoH;
      let srcX = 0, srcY = 0, srcW = videoW, srcH = videoH;

      if (imgRatio > targetRatio) {
        srcW = videoH * targetRatio;
        srcX = (videoW - srcW) / 2;
      } else {
        srcH = videoW / targetRatio;
        srcY = (videoH - srcH) / 2;
      }

      fCtx.drawImage(rawTempCanvas, srcX, srcY, srcW, srcH, photoX, photoY, photoW, photoH);

      fCtx.fillStyle = '#4B5563';
      fCtx.font = 'bold 24px monospace';
      fCtx.textAlign = 'left';
      fCtx.fillText(state.currentDateStr, 32, 940);
      fCtx.textAlign = 'right';
      fCtx.fillText(`ID: ${state.currentPhotoRawID}(raw)`, 768, 940);

      state.currentPhotoData = frameCanvas.toDataURL('image/png');

      document.getElementById('captured-preview').src = state.currentPhotoData;
      document.getElementById('camera-screen').classList.add('hidden');
      document.getElementById('photo-confirm-screen').classList.remove('hidden');
    }

    function resizeCanvases() {
      const container = document.getElementById('canvas-container');
      const rect = container.getBoundingClientRect();

      if (rect.width === 0 || rect.height === 0) return;

      const targetRatio = 800 / 1000;
      const containerRatio = rect.width / rect.height;

      let canvasW, canvasH;
      if (containerRatio > targetRatio) {
        canvasH = rect.height;
        canvasW = rect.height * targetRatio;
      } else {
        canvasW = rect.width;
        canvasH = rect.width / targetRatio;
      }

      photoCanvas.style.width = canvasW + 'px';
      photoCanvas.style.height = canvasH + 'px';
      drawCanvas.style.width = canvasW + 'px';
      drawCanvas.style.height = canvasH + 'px';
      stampLayer.style.width = canvasW + 'px';
      stampLayer.style.height = canvasH + 'px';

      photoCanvas.width = canvasW;
      photoCanvas.height = canvasH;
      drawCanvas.width = canvasW;
      drawCanvas.height = canvasH;

      if (state.currentPhotoData) {
        const img = new Image();
        img.onload = () => {
          photoCtx.clearRect(0, 0, photoCanvas.width, photoCanvas.height);
          photoCtx.drawImage(img, 0, 0, photoCanvas.width, photoCanvas.height);
        };
        img.src = state.currentPhotoData;
      }
    }

    function setupCanvasDrawing() {
      function getPos(e) {
        const rect = drawCanvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return {
          x: clientX - rect.left,
          y: clientY - rect.top
        };
      }

      function startDraw(e) {
        if (state.activeDragStampId) return;

        // スタンプ配置待ちモード時
        if (state.pendingStampChar) {
          const pos = getPos(e);
          addStampAt(state.pendingStampChar, pos.x, pos.y);
          finishStampPlacement(); // 配置完了・モードをnullにセットしてペン先非復帰
          return;
        }

        // ペン/消しゴムモードがアクティブでない（スタンプ自動解除後のペン未タップ時など）場合は描画不可
        if (!state.currentMode) return;

        const pos = getPos(e);

        if (state.selectedStampId) {
          state.selectedStampId = null;
          renderStamps();
        }

        state.isDrawing = true;
        drawCtx.beginPath();
        drawCtx.moveTo(pos.x, pos.y);

        if (state.currentMode === 'eraser') {
          drawCtx.globalCompositeOperation = 'destination-out';
          drawCtx.lineWidth = state.eraserLineWidth;
        } else {
          drawCtx.globalCompositeOperation = 'source-over';
          drawCtx.strokeStyle = state.currentColor;
          drawCtx.lineWidth = state.penLineWidth;
          drawCtx.lineCap = 'round';
          drawCtx.lineJoin = 'round';
        }
      }

      function moveDraw(e) {
        if (!state.isDrawing || state.activeDragStampId || state.pendingStampChar || !state.currentMode) return;
        const pos = getPos(e);
        drawCtx.lineTo(pos.x, pos.y);
        drawCtx.stroke();
      }

      function stopDraw() {
        if (state.isDrawing) {
          drawCtx.closePath();
          state.isDrawing = false;
        }
      }

      drawCanvas.addEventListener('mousedown', startDraw);
      drawCanvas.addEventListener('mousemove', moveDraw);
      drawCanvas.addEventListener('mouseup', stopDraw);

      drawCanvas.addEventListener('touchstart', (e) => {
        if (state.pendingStampChar) {
          const pos = getPos(e);
          addStampAt(state.pendingStampChar, pos.x, pos.y);
          finishStampPlacement();
          return;
        }
        if (!state.currentMode) return;
        e.preventDefault();
        startDraw(e);
      }, { passive: false });

      drawCanvas.addEventListener('touchmove', (e) => {
        if (state.activeDragStampId || state.pendingStampChar || !state.currentMode) return;
        e.preventDefault();
        moveDraw(e);
      }, { passive: false });

      drawCanvas.addEventListener('touchend', stopDraw);
    }

    function addStampAt(char, x, y) {
      const newId = 'stamp-' + Date.now();
      const stamp = {
        id: newId,
        char: char,
        x: x,
        y: y
      };
      state.stamps.push(stamp);
      state.selectedStampId = newId;
      renderStamps();
    }

    function renderStamps() {
      stampLayer.innerHTML = '';

      state.stamps.forEach(s => {
        const el = document.createElement('div');
        const isSelected = (s.id === state.selectedStampId);

        el.className = `stamp-element ${isSelected ? 'selected' : ''}`;
        el.innerText = s.char;
        el.style.left = s.x + 'px';
        el.style.top = s.y + 'px';

        if (isSelected) {
          const deleteBtn = document.createElement('div');
          deleteBtn.className = 'stamp-delete-btn';
          deleteBtn.innerText = '✕';
          
          const handleDelete = (e) => {
            e.stopPropagation();
            e.preventDefault();
            deleteStamp(s.id);
          };
          deleteBtn.addEventListener('click', handleDelete);
          deleteBtn.addEventListener('touchstart', handleDelete, { passive: false });

          el.appendChild(deleteBtn);
        }

        const handleDragStart = (e) => {
          e.stopPropagation();
          state.isDrawing = false;
          state.selectedStampId = s.id;
          state.activeDragStampId = s.id;

          const rect = stampLayer.getBoundingClientRect();
          const clientX = e.touches ? e.touches[0].clientX : e.clientX;
          const clientY = e.touches ? e.touches[0].clientY : e.clientY;

          state.dragOffset = {
            x: (clientX - rect.left) - s.x,
            y: (clientY - rect.top) - s.y
          };
          renderStamps();
        };

        el.addEventListener('mousedown', handleDragStart);
        el.addEventListener('touchstart', (e) => {
          e.preventDefault();
          handleDragStart(e);
        }, { passive: false });

        stampLayer.appendChild(el);
      });
    }

    function deleteStamp(id) {
      state.stamps = state.stamps.filter(s => s.id !== id);
      if (state.selectedStampId === id) {
        state.selectedStampId = null;
      }
      renderStamps();
    }

    function onGlobalMove(e) {
      if (!state.activeDragStampId) return;
      e.preventDefault();

      const stamp = state.stamps.find(s => s.id === state.activeDragStampId);
      if (!stamp) return;

      const rect = stampLayer.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;

      stamp.x = (clientX - rect.left) - state.dragOffset.x;
      stamp.y = (clientY - rect.top) - state.dragOffset.y;

      renderStamps();
    }

    function onGlobalEnd() {
      if (state.activeDragStampId) {
        state.activeDragStampId = null;
      }
    }

    window.addEventListener('mousemove', onGlobalMove);
    window.addEventListener('mouseup', onGlobalEnd);
    window.addEventListener('touchmove', onGlobalMove, { passive: false });
    window.addEventListener('touchend', onGlobalEnd);

    function generateMergedHighResDataURL() {
      const exportCanvas = document.createElement('canvas');
      exportCanvas.width = 800;
      exportCanvas.height = 1000;
      const ctx = exportCanvas.getContext('2d');

      ctx.drawImage(photoCanvas, 0, 0, 800, 1000);
      ctx.drawImage(drawCanvas, 0, 0, 800, 1000);

      const rect = drawCanvas.getBoundingClientRect();
      if (rect.width > 0 && rect.height > 0) {
        const scaleX = 800 / rect.width;
        const scaleY = 1000 / rect.height;

        ctx.font = '55px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        state.stamps.forEach(s => {
          ctx.fillText(s.char, s.x * scaleX, s.y * scaleY);
        });
      }

      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(450, 915, 330, 45);

      ctx.fillStyle = '#4B5563';
      ctx.font = 'bold 24px monospace';
      ctx.textAlign = 'right';
      ctx.fillText(`ID: ${state.currentPhotoRawID}(deco)`, 768, 940);

      return exportCanvas.toDataURL('image/png');
    }

    function saveImageLocally(dataUrl, filename) {
      try {
        const arr = dataUrl.split(',');
        const mime = arr[0].match(/:(.*?);/)[1];
        const bstr = atob(arr[1]);
        let n = bstr.length;
        const u8arr = new Uint8Array(n);
        while (n--) {
          u8arr[n] = bstr.charCodeAt(n);
        }
        const blob = new Blob([u8arr], { type: mime });
        const blobUrl = URL.createObjectURL(blob);

        const link = document.createElement('a');
        link.href = blobUrl;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);

        setTimeout(() => URL.revokeObjectURL(blobUrl), 1000);
        showToast("端末へ保存しました");
      } catch (e) {
        console.error("端末保存エラー:", e);
      }
    }
  </script>
</body>
