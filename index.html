<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ChekiSnap</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700&display=swap');
        body {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
            position: fixed;
            inset: 0;
        }
        .stamp-item {
            cursor: grab;
            transition: transform 0.1s;
        }
        .stamp-item:active {
            cursor: grabbing;
        }
        .animate-pop {
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .shutter-flash {
            position: fixed;
            inset: 0;
            background: white;
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease-out;
        }
        .shutter-flash.active {
            opacity: 1;
        }
    </style>
</head>
<body class="h-full w-full flex flex-col justify-between max-w-md mx-auto relative bg-slate-900 border-x border-slate-800">

    <!-- シャッターフラッシュ効果 -->
    <div id="shutter-flash" class="shutter-flash"></div>

    <!-- ヘッダー（グループ・メンバー表示＆コントロール類） -->
    <header class="bg-slate-900/90 backdrop-blur border-b border-slate-800/80 px-3 py-2 z-40 flex items-center justify-between flex-shrink-0">
        <!-- 左側：グループ・メンバー名切替ボタン -->
        <button id="btn-quick-select" class="bg-slate-800/90 hover:bg-slate-700 active:scale-95 text-xs text-slate-200 px-3 py-1.5 rounded-full border border-slate-700 shadow-sm flex items-center space-x-1.5 transition">
            <span id="badge-idol-group" class="bg-white/20 text-white px-1.5 py-0.5 rounded text-[9px] truncate max-w-[70px]">グループ</span>
            <span id="badge-idol-name" class="font-bold">メンバー</span>
            <i class="fa-solid fa-chevron-down text-[10px] text-slate-400 ml-0.5"></i>
        </button>

        <!-- 右側コントロール -->
        <div class="flex items-center space-x-1.5">
            <button id="btn-flash" class="bg-slate-800 hover:bg-slate-700 text-slate-200 w-8 h-8 rounded-full flex items-center justify-center border border-slate-700 transition">
                <i class="fa-solid fa-bolt text-xs"></i>
            </button>
            <button id="btn-camera-flip" class="bg-slate-800 hover:bg-slate-700 text-slate-200 w-8 h-8 rounded-full flex items-center justify-center border border-slate-700 transition">
                <i class="fa-solid fa-rotate text-xs"></i>
            </button>
            <button id="btn-timer" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-2.5 h-8 rounded-full text-xs border border-slate-700 flex items-center space-x-1 transition">
                <i class="fa-regular fa-clock text-xs"></i>
                <span id="timer-label">OFF</span>
            </button>
            <button id="btn-open-settings" class="bg-slate-800 hover:bg-slate-700 text-slate-200 w-8 h-8 rounded-full flex items-center justify-center border border-slate-700 transition">
                <i class="fa-solid fa-gear text-xs text-pink-400"></i>
            </button>
        </div>
    </header>

    <!-- メインコンテンツ領域 -->
    <main id="main-container" class="flex-1 flex flex-col items-center justify-center relative overflow-hidden p-2 min-h-0">
        
        <!-- ================= 1. カメラビュー ================= -->
        <div id="view-camera" class="w-full h-full flex flex-col items-center justify-center relative overflow-hidden">
            
            <!-- カウントダウン -->
            <div id="timer-countdown-overlay" class="absolute inset-0 z-30 flex items-center justify-center bg-black/60 backdrop-blur-sm hidden pointer-events-none">
                <span id="timer-countdown-number" class="text-8xl font-black text-pink-400 animate-pulse">3</span>
            </div>

            <!-- チェキ風フレーム容器（上下左右にバランスよく収まるよう最大化・比率維持） -->
            <div id="cheki-camera-box" class="w-full max-w-[340px] aspect-[4/5] flex flex-col relative rounded-2xl overflow-hidden shadow-2xl transition-colors duration-300">
                
                <!-- ファインダー映像領域（上部を大きく確保） -->
                <div class="w-full flex-1 bg-slate-950 relative overflow-hidden">
                    <video id="camera-video" autoplay playsinline muted class="w-full h-full object-cover"></video>
                    <canvas id="photo-canvas" class="absolute inset-0 w-full h-full object-cover hidden"></canvas>
                </div>

                <!-- チェキ風の下部メタ情報バー -->
                <div id="camera-footer-bar" class="py-3 px-4 flex justify-between items-center text-[11px] font-mono tracking-wider flex-shrink-0 z-10 transition-colors duration-300">
                    <span id="frame-date" class="font-bold">2026.08.28</span>
                    <span id="frame-photo-id">ID: ----</span>
                    <span id="frame-idol-sign" class="font-bold truncate max-w-[130px] text-right">MEMBER</span>
                </div>
            </div>
        </div>

        <!-- ================= 2. デコレーションビュー ================= -->
        <div id="view-deco" class="w-full h-full flex flex-col justify-between hidden relative overflow-hidden">
            
            <!-- デコツールバー -->
            <div class="bg-slate-900/90 backdrop-blur px-3 py-1.5 flex justify-between items-center z-20 flex-shrink-0 border-b border-slate-800">
                <button id="btn-back-to-camera" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1.5 rounded-lg text-xs border border-slate-700 flex items-center space-x-1 transition">
                    <i class="fa-solid fa-arrow-left text-xs"></i>
                    <span>撮り直す</span>
                </button>

                <div class="flex space-x-1 bg-slate-800 p-1 rounded-xl border border-slate-700">
                    <button id="btn-mode-pen" class="px-3 py-1 rounded-lg text-xs font-bold bg-pink-600 text-white transition shadow">ペン</button>
                    <button id="btn-mode-eraser" class="px-3 py-1 rounded-lg text-xs font-bold text-slate-400 hover:text-white transition">消しゴム</button>
                    <button id="btn-mode-stamp" class="px-3 py-1 rounded-lg text-xs font-bold text-slate-400 hover:text-white transition">スタンプ</button>
                </div>

                <button id="btn-clear-canvas" class="bg-rose-900/40 hover:bg-rose-900/60 text-rose-300 p-2 rounded-lg text-xs border border-rose-800/50 transition">
                    <i class="fa-solid fa-rotate-right"></i>
                </button>
            </div>

            <!-- サイズ変更バー -->
            <div id="size-control-bar" class="absolute top-12 left-1/2 -translate-x-1/2 flex justify-center items-center space-x-3 bg-slate-900/90 backdrop-blur py-1 px-4 rounded-full border border-slate-700 text-xs z-30 shadow-lg">
                <span id="size-label-title" class="text-slate-400 font-bold">太さ:</span>
                <button id="btn-size-sm" class="px-2 py-0.5 rounded bg-slate-700 text-slate-200">細</button>
                <button id="btn-size-md" class="px-2 py-0.5 rounded bg-pink-600 text-white font-bold">中</button>
                <button id="btn-size-lg" class="px-2 py-0.5 rounded bg-slate-700 text-slate-200">太</button>
            </div>

            <!-- デコレーション用チェキ枠ボックス（中央配置） -->
            <div class="flex-1 flex items-center justify-center relative overflow-hidden py-1">
                <div id="cheki-deco-box" class="w-full max-w-[340px] aspect-[4/5] flex flex-col relative rounded-2xl overflow-hidden shadow-2xl transition-colors duration-300">
                    <div id="deco-canvas-wrapper" class="w-full flex-1 relative bg-black overflow-hidden">
                        <img id="deco-photo-img" class="w-full h-full object-cover pointer-events-none" src="" alt="Captured">
                        <canvas id="draw-canvas" class="absolute inset-0 w-full h-full cursor-crosshair touch-none"></canvas>
                        <div id="stamps-layer" class="absolute inset-0 overflow-hidden pointer-events-none"></div>
                    </div>

                    <div id="deco-footer-bar" class="py-3 px-4 flex justify-between items-center text-[11px] font-mono tracking-wider flex-shrink-0 z-10 pointer-events-none transition-colors duration-300">
                        <span id="deco-frame-date" class="font-bold">2026.08.28</span>
                        <span id="deco-frame-photo-id">ID: ----</span>
                        <span id="deco-frame-idol-sign" class="font-bold truncate max-w-[130px] text-right">MEMBER</span>
                    </div>
                </div>
            </div>

            <!-- カラーパレット / スタンプ選択 -->
            <div class="bg-slate-900/95 backdrop-blur p-2 border-t border-slate-800 z-20 flex-shrink-0">
                <div id="palette-container" class="flex justify-around items-center overflow-x-auto py-0.5"></div>
                <div id="stamp-palette-container" class="hidden flex justify-center space-x-2 py-0.5">
                    <button class="stamp-chooser w-8 h-8 bg-slate-800 hover:bg-slate-700 rounded-lg text-base flex items-center justify-center border border-slate-700">💖</button>
                    <button class="stamp-chooser w-8 h-8 bg-slate-800 hover:bg-slate-700 rounded-lg text-base flex items-center justify-center border border-slate-700">✨</button>
                    <button class="stamp-chooser w-8 h-8 bg-slate-800 hover:bg-slate-700 rounded-lg text-base flex items-center justify-center border border-slate-700">推</button>
                    <button class="stamp-chooser w-8 h-8 bg-slate-800 hover:bg-slate-700 rounded-lg text-base flex items-center justify-center border border-slate-700">⭐</button>
                    <button class="stamp-chooser w-8 h-8 bg-slate-800 hover:bg-slate-700 rounded-lg text-base flex items-center justify-center border border-slate-700">🎀</button>
                    <button class="stamp-chooser w-8 h-8 bg-slate-800 hover:bg-slate-700 rounded-lg text-base flex items-center justify-center border border-slate-700">🔥</button>
                    <button class="stamp-chooser w-8 h-8 bg-slate-800 hover:bg-slate-700 rounded-lg text-base flex items-center justify-center border border-slate-700">🥺</button>
                </div>
            </div>

            <!-- 保存ボタン -->
            <div class="bg-slate-900 px-3 py-2 flex-shrink-0 border-t border-slate-800">
                <button id="btn-save-deco" class="w-full py-2.5 bg-gradient-to-r from-pink-500 to-rose-500 text-white rounded-xl font-bold text-xs shadow-lg shadow-pink-500/30 active:scale-[0.98] transition flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-download"></i>
                    <span>チェキを保存する / 共有</span>
                </button>
            </div>
        </div>

        <!-- ================= 3. アルバムビュー ================= -->
        <div id="view-album" class="w-full h-full flex flex-col p-2 hidden relative overflow-y-auto">
            <h2 class="font-bold text-xs text-slate-300 mb-2 flex items-center">
                <i class="fa-solid fa-images text-pink-400 mr-2"></i>保存済みチェキアルバム
            </h2>
            <div id="album-grid" class="grid grid-cols-2 gap-2.5 pb-20"></div>
            <div id="album-empty" class="flex-1 flex flex-col items-center justify-center text-center py-12 hidden">
                <i class="fa-regular fa-face-smile text-slate-600 text-4xl mb-2"></i>
                <p class="text-xs text-slate-400">保存されたチェキはまだありません</p>
            </div>
        </div>

    </main>

    <!-- 下部タブナビゲーション（シャッター中央） -->
    <nav class="bg-slate-900/95 backdrop-blur border-t border-slate-800 px-6 pt-2 pb-5 z-40 flex justify-around items-center flex-shrink-0">
        <button id="nav-btn-camera" class="flex flex-col items-center text-pink-400 transition w-16">
            <i class="fa-solid fa-camera text-lg mb-0.5"></i>
            <span class="text-[10px] font-bold">カメラ</span>
        </button>

        <div class="flex justify-center items-center -mt-4">
            <button id="btn-shutter" class="w-16 h-16 rounded-full bg-gradient-to-tr from-pink-500 to-rose-400 p-1 shadow-xl shadow-pink-500/40 active:scale-95 transition flex items-center justify-center">
                <div class="w-13 h-13 rounded-full border-4 border-white bg-transparent flex items-center justify-center">
                    <div class="w-8 h-8 rounded-full bg-white shadow-inner"></div>
                </div>
            </button>
        </div>

        <button id="nav-btn-album" class="flex flex-col items-center text-slate-400 hover:text-slate-200 transition w-16">
            <i class="fa-solid fa-photo-film text-lg mb-0.5"></i>
            <span class="text-[10px]">アルバム</span>
        </button>
    </nav>

    <!-- クイック選択モーダル -->
    <div id="modal-quick-select" class="fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-center justify-center p-4 hidden">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-xs rounded-2xl p-4 shadow-2xl flex flex-col max-h-[80vh] animate-pop">
            <div class="flex justify-between items-center mb-3 border-b border-slate-800 pb-2">
                <h3 class="font-bold text-xs text-slate-200 flex items-center">
                    <i class="fa-solid fa-users text-pink-400 mr-2"></i>メンバーを選択
                </h3>
                <button id="btn-close-quick-select" class="text-slate-400 hover:text-white p-1">
                    <i class="fa-solid fa-xmark text-base"></i>
                </button>
            </div>
            <div id="quick-select-list" class="flex-1 overflow-y-auto space-y-2 pr-1"></div>
        </div>
    </div>

    <!-- 設定モーダル -->
    <div id="modal-settings" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 hidden">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-sm rounded-2xl p-4 shadow-2xl flex flex-col max-h-[90vh]">
            <div class="flex justify-between items-center mb-3 border-b border-slate-800 pb-2">
                <h3 class="font-bold text-xs text-slate-200 flex items-center">
                    <i class="fa-solid fa-users-gear text-pink-400 mr-2"></i>推しメンバー設定
                </h3>
                <button id="btn-close-settings" class="text-slate-400 hover:text-white p-1">
                    <i class="fa-solid fa-xmark text-base"></i>
                </button>
            </div>

            <div class="flex-1 overflow-y-auto space-y-2 mb-3 pr-1">
                <div class="text-[10px] text-slate-400 font-bold mb-1">登録済みメンバー一覧</div>
                <div id="settings-member-list" class="space-y-1.5"></div>
            </div>

            <div class="bg-slate-800/60 border border-slate-700/80 rounded-xl p-3 space-y-2">
                <div class="text-[11px] font-bold text-pink-300 flex justify-between items-center">
                    <span id="form-mode-title">推しメンバー追加</span>
                    <button id="btn-reset-form" class="text-[10px] text-slate-400 hover:text-slate-200 underline">クリア</button>
                </div>
                <input type="hidden" id="edit-member-id" value="">
                
                <div>
                    <label class="block text-[10px] text-slate-400 mb-1">グループ名</label>
                    <div class="flex space-x-2">
                        <select id="select-group" class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-pink-500"></select>
                        <input type="text" id="input-new-group-name" placeholder="新しいグループ名" class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-pink-500 hidden">
                        <button id="btn-toggle-new-group" class="bg-slate-700 hover:bg-slate-600 text-slate-200 px-2.5 py-1.5 rounded-lg text-xs transition">+ 新規</button>
                    </div>
                </div>

                <div>
                    <label class="block text-[10px] text-slate-400 mb-1">メンバー名</label>
                    <input type="text" id="input-member-name" placeholder="例: 推しメン" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-pink-500">
                </div>

                <div>
                    <label class="block text-[10px] text-slate-400 mb-1">メンバーカラー: <span id="selected-color-name" class="font-bold text-white">白</span></label>
                    <div id="idol-color-picker" class="grid grid-cols-4 gap-1.5 pt-1"></div>
                </div>

                <button id="btn-save-member" class="w-full py-2 bg-pink-600 hover:bg-pink-700 text-white rounded-lg text-xs font-bold transition shadow-md">
                    メンバーを追加する
                </button>
            </div>
        </div>
    </div>

    <!-- 閲覧モーダル -->
    <div id="modal-viewer" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 hidden">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-sm rounded-2xl p-4 shadow-2xl flex flex-col items-center relative max-h-[95vh]">
            <button id="btn-close-viewer" class="absolute top-3 right-3 text-slate-400 hover:text-white p-2 z-10">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
            
            <h3 class="font-bold text-xs text-slate-300 mb-2">チェキ詳細</h3>
            
            <div class="w-full max-w-[280px] aspect-[4/5] bg-white rounded-xl overflow-hidden shadow-2xl mb-4 flex items-center justify-center">
                <img id="viewer-image" class="w-full h-full object-contain" src="" alt="Cheki">
            </div>

            <div class="flex space-x-2 w-full">
                <button id="viewer-btn-download" class="flex-1 py-2.5 bg-pink-600 hover:bg-pink-700 text-white rounded-xl text-xs font-bold transition flex items-center justify-center space-x-1.5">
                    <i class="fa-solid fa-download"></i>
                    <span>保存</span>
                </button>
                <button id="viewer-btn-share" class="flex-1 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 rounded-xl text-xs font-bold transition flex items-center justify-center space-x-1.5">
                    <i class="fa-solid fa-share-nodes"></i>
                    <span>シェア</span>
                </button>
                <button id="viewer-btn-delete" class="px-3 py-2.5 bg-rose-900/40 hover:bg-rose-900/60 text-rose-300 border border-rose-800/50 rounded-xl text-xs font-bold transition">
                    <i class="fa-solid fa-trash"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- アプリケーションロジック -->
    <script>
        const IDOL_COLORS = [
            { name: '白', hex: '#FFFFFF' },
            { name: '赤', hex: '#EF4444' },
            { name: '青', hex: '#0000FF' },
            { name: '黄', hex: '#FFFF00' },
            { name: '紫', hex: '#ff00ff' },
            { name: '緑', hex: '#228B22' },
            { name: 'ピンク', hex: '#EC4899' },
            { name: 'パステルブルー', hex: '#7DD3FC' },
            { name: 'エメラルドグリーン', hex: '#10B981' },
            { name: 'オレンジ', hex: '#F97316' },
            { name: '黒', hex: '#1E293B' }
        ];

        const DRAWING_COLORS = [
            { name: '白', hex: '#FFFFFF' },
            { name: '黒', hex: '#1E293B' },
            { name: '赤', hex: '#EF4444' },
            { name: '青', hex: '#0000FF' },
            { name: '黄', hex: '#FFFF00' },
            { name: '紫', hex: '#ff00ff' },
            { name: '緑', hex: '#228B22' },
            { name: 'ピンク', hex: '#EC4899' },
            { name: 'パステルブルー', hex: '#7DD3FC' },
            { name: 'エメラルドグリーン', hex: '#10B981' },
            { name: 'オレンジ', hex: '#F97316' }
        ];

        const state = {
            currentFacingMode: 'user',
            flashOn: false,
            timerSec: 0,
            currentPhotoData: null,
            currentPhotoRawID: '',
            currentDateStr: '',
            
            isDrawing: false,
            currentMode: 'pen',
            currentColor: '#FFFFFF',
            penLineWidth: 7,
            eraserLineWidth: 18,
            penSizeLabel: '中',
            eraserSizeLabel: '中',
            
            stamps: [],
            activeDragStampId: null,
            dragOffset: { x: 0, y: 0 },

            currentActiveTab: 'camera',
            albumItems: [],
            selectedAlbumItem: null,

            members: [],
            selectedMemberId: null,
            selectedColor: '#FFFFFF',
            selectedColorName: '白',
            isCreatingNewGroup: false
        };

        const STORAGE_KEY_MEMBERS = 'cheki_snap_members_v4';
        const STORAGE_KEY_ALBUM = 'cheki_snap_album_v4';

        const videoEl = document.getElementById('camera-video');
        const photoCanvas = document.getElementById('photo-canvas');
        const drawCanvas = document.getElementById('draw-canvas');
        const shutterFlash = document.getElementById('shutter-flash');

        window.addEventListener('DOMContentLoaded', async () => {
            initDateAndID();
            await initMembers();
            initCameraStream();
            initColorPaletteUI();
            initIdolColorPaletteUI();
            initEventListeners();
            loadAlbumFromStorage();
        });

        function initDateAndID() {
            const now = new Date();
            const y = now.getFullYear();
            const m = String(now.getMonth() + 1).padStart(2, '0');
            const d = String(now.getDate()).padStart(2, '0');
            state.currentDateStr = `${y}.${m}.${d}`;
            state.currentPhotoRawID = Math.floor(1000 + Math.random() * 9000);

            document.getElementById('frame-date').innerText = state.currentDateStr;
            document.getElementById('frame-photo-id').innerText = `ID: ${state.currentPhotoRawID}`;
            document.getElementById('deco-frame-date').innerText = state.currentDateStr;
            document.getElementById('deco-frame-photo-id').innerText = `ID: ${state.currentPhotoRawID}`;
        }

        async function initMembers() {
            const saved = localStorage.getItem(STORAGE_KEY_MEMBERS);
            if (saved) {
                try {
                    state.members = JSON.parse(saved);
                } catch (e) {
                    state.members = [];
                }
            }

            if (state.members.length === 0) {
                const defaultMember = {
                    id: 'mem_' + Date.now(),
                    groupName: 'グループA',
                    memberName: 'メンバー1',
                    color: '#FFFFFF'
                };
                state.members = [defaultMember];
                saveMembersToStorage();
            }

            state.selectedMemberId = state.members[0].id;
            updateIdolBadgeUI();
        }

        function saveMembersToStorage() {
            localStorage.setItem(STORAGE_KEY_MEMBERS, JSON.stringify(state.members));
        }

        function getContrastTextColor(hexColor) {
            if (!hexColor) return '#1f2937';
            let cleanHex = hexColor.replace('#', '');
            if (cleanHex.length === 3) {
                cleanHex = cleanHex.split('').map(c => c + c).join('');
            }
            const r = parseInt(cleanHex.substr(0, 2), 16) || 0;
            const g = parseInt(cleanHex.substr(2, 2), 16) || 0;
            const b = parseInt(cleanHex.substr(4, 2), 16) || 0;
            const yiq = (r * 299 + g * 587 + b * 114) / 1000;
            return yiq >= 150 ? '#1f2937' : '#FFFFFF';
        }

        function runTimerAndCapture(sec) {
            const overlay = document.getElementById('timer-countdown-overlay');
            const numEl = document.getElementById('timer-countdown-number');
            overlay.classList.remove('hidden');
            
            let count = sec;
            numEl.innerText = count;

            const timerInterval = setInterval(() => {
                count--;
                if (count > 0) {
                    numEl.innerText = count;
                } else {
                    clearInterval(timerInterval);
                    overlay.classList.add('hidden');
                    capturePhoto();
                }
            }, 1000);
        }

        function capturePhoto() {
            shutterFlash.classList.add('active');
            setTimeout(() => shutterFlash.classList.remove('active'), 200);

            const videoWidth = videoEl.videoWidth || 1080;
            const videoHeight = videoEl.videoHeight || 1920;

            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = videoWidth;
            tempCanvas.height = videoHeight;
            const ctx = tempCanvas.getContext('2d');

            if (state.currentFacingMode === 'user') {
                ctx.translate(videoWidth, 0);
                ctx.scale(-1, 1);
            }

            try {
                ctx.drawImage(videoEl, 0, 0, videoWidth, videoHeight);
            } catch (e) {
                ctx.fillStyle = '#334155';
                ctx.fillRect(0, 0, videoWidth, videoHeight);
            }

            state.currentPhotoData = tempCanvas.toDataURL('image/png');

            setTimeout(() => {

                const dCtx = drawCanvas.getContext('2d');

            }, 50);

            switchTab('deco');

        function setupCanvasDrawingEvents() {
            const ctx = drawCanvas.getContext('2d');

            function getPos(e) {
                const rect = drawCanvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return {
                    x: clientX - rect.left,
                    y: clientY - rect.top
                };
            }

            const startDraw = (e) => {
                if (state.currentMode === 'stamp') return;
                state.isDrawing = true;
                const pos = getPos(e);
                ctx.beginPath();
                ctx.moveTo(pos.x, pos.y);
            };

            const draw = (e) => {
                if (!state.isDrawing || state.currentMode === 'stamp') return;
                e.preventDefault();
                const pos = getPos(e);

                ctx.lineTo(pos.x, pos.y);
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';

                if (state.currentMode === 'pen') {
                    ctx.strokeStyle = state.currentColor;
                    ctx.lineWidth = state.penLineWidth;
                    ctx.globalCompositeOperation = 'source-over';
                } else if (state.currentMode === 'eraser') {
                    ctx.lineWidth = state.eraserLineWidth;
                    ctx.globalCompositeOperation = 'destination-out';
                }
                ctx.stroke();
            };

            const stopDraw = () => {
                if (!state.isDrawing) return;
                state.isDrawing = false;
                ctx.closePath();
            };

            drawCanvas.addEventListener('mousedown', startDraw);
            drawCanvas.addEventListener('mousemove', draw);
            drawCanvas.addEventListener('mouseup', stopDraw);
            drawCanvas.addEventListener('mouseleave', stopDraw);

            drawCanvas.addEventListener('touchstart', startDraw, { passive: false });
            drawCanvas.addEventListener('touchmove', draw, { passive: false });
            drawCanvas.addEventListener('touchend', stopDraw);
        }

        function addStampToCanvas(char) {
            const wrapper = document.getElementById('deco-canvas-wrapper');
            const newStamp = {
                id: 'stamp_' + Date.now() + Math.random(),
                char: char,
                x: wrapper.clientWidth / 2 - 20,
                y: wrapper.clientHeight / 2 - 20
            };
            state.stamps.push(newStamp);
            renderStampsDOM();
        }

        function renderStampsDOM() {
            const layer = document.getElementById('stamps-layer');
            layer.innerHTML = '';

            state.stamps.forEach(s => {
                const el = document.createElement('div');
                el.className = 'absolute text-3xl select-none stamp-item animate-pop flex items-center justify-center p-2';
                el.style.left = `${s.x}px`;
                el.style.top = `${s.y}px`;
                el.innerText = s.char;

                const onDragStart = (e) => {
                    e.stopPropagation();
                    state.activeDragStampId = s.id;
                    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                    state.dragOffset = {
                        x: clientX - s.x,
                        y: clientY - s.y
                    };
                };

                el.addEventListener('mousedown', onDragStart);
                el.addEventListener('touchstart', onDragStart, { passive: true });

                layer.appendChild(el);
            });
        }

        window.addEventListener('mousemove', (e) => {
            if (!state.activeDragStampId) return;
            const target = state.stamps.find(st => st.id === state.activeDragStampId);
            if (!target) return;

            const wrapper = document.getElementById('deco-canvas-wrapper');
            const rect = wrapper.getBoundingClientRect();
            target.x = Math.max(0, Math.min(rect.width - 40, e.clientX - rect.left - 20));
            target.y = Math.max(0, Math.min(rect.height - 40, e.clientY - rect.top - 20));

            renderStampsDOM();
        });

        window.addEventListener('mouseup', () => {
            state.activeDragStampId = null;
        });

        window.addEventListener('touchmove', (e) => {
            if (!state.activeDragStampId) return;
            const target = state.stamps.find(st => st.id === state.activeDragStampId);
            if (!target) return;

            const wrapper = document.getElementById('deco-canvas-wrapper');
            const rect = wrapper.getBoundingClientRect();
            target.x = Math.max(0, Math.min(rect.width - 40, e.touches[0].clientX - rect.left - 20));
            target.y = Math.max(0, Math.min(rect.height - 40, e.touches[0].clientY - rect.top - 20));

            renderStampsDOM();
        }, { passive: true });

        window.addEventListener('touchend', () => {
            state.activeDragStampId = null;
        });

        function generateMergedHighResDataURL() {
            const exportCanvas = document.createElement('canvas');
            exportCanvas.width = 800;
            exportCanvas.height = 1000;
            const ctx = exportCanvas.getContext('2d');

            const baseImg = new Image();
            baseImg.src = state.currentPhotoData;
            
            const activeMember = state.members.find(m => m.id === state.selectedMemberId) || state.members[0];
            const frameColor = activeMember ? activeMember.color : '#FFFFFF';
            
            ctx.fillStyle = frameColor;
            ctx.fillRect(0, 0, 800, 1000);

            const photoX = 0, photoY = 0, photoW = 800, photoH = 900;
            ctx.drawImage(baseImg, photoX, photoY, photoW, photoH, photoX, photoY, photoW, photoH);

            ctx.drawImage(drawCanvas, 0, 0, 800, 900);

            const rect = drawCanvas.getBoundingClientRect();
            if (rect.width > 0 && rect.height > 0) {
                const scaleX = 800 / rect.width;
                const scaleY = 900 / rect.height;

                ctx.font = '55px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                state.stamps.forEach(s => {
                    ctx.fillText(s.char, s.x * scaleX, s.y * scaleY);
                });
            }

            ctx.fillStyle = frameColor;
            ctx.fillRect(0, 900, 800, 1000);

            const groupTxt = activeMember ? activeMember.groupName : '';
            const memberTxt = activeMember ? activeMember.memberName : '';
            const exportTextColor = getContrastTextColor(frameColor);
            const exportSubTextColor = exportTextColor === '#FFFFFF' ? 'rgba(255, 255, 255, 0.85)' : '#4B5563';

            ctx.font = 'bold 20px monospace';
            ctx.textBaseline = 'middle';

            ctx.textAlign = 'left';
            ctx.fillStyle = exportSubTextColor;
            ctx.fillText(state.currentDateStr, 25, 950);

            ctx.textAlign = 'center';
            ctx.fillStyle = exportSubTextColor;
            ctx.fillText(`ID: ${state.currentPhotoRawID}`, 330, 950);

            const rightX = 775;
            ctx.fillStyle = exportTextColor;
            ctx.font = 'bold 22px monospace';
            const memberTextW = ctx.measureText(memberTxt).width;

            ctx.textAlign = 'right';
            ctx.fillStyle = exportSubTextColor;
            ctx.font = 'bold 20px monospace';
            ctx.fillText(`)`, rightX, 950);

            ctx.textAlign = 'right';
            ctx.fillStyle = exportTextColor;
            ctx.font = 'bold 22px monospace';
            ctx.fillText(memberTxt, rightX - ctx.measureText(`)`).width, 950);

            ctx.textAlign = 'right';
            ctx.fillStyle = exportSubTextColor;
            ctx.font = 'bold 20px monospace';
            ctx.fillText(` (${groupTxt}`, rightX - ctx.measureText(`)`).width - memberTextW, 950);

            return exportCanvas.toDataURL('image/png');
        }

            IDOL_COLORS.forEach(c => {
                const btn = document.createElement('button');
                btn.className = `flex flex-col items-center justify-center p-1 rounded-xl transition transform hover:scale-105 border ${state.selectedColor.toLowerCase() === c.hex.toLowerCase() ? 'bg-slate-700 border-pink-500 shadow-md' : 'bg-slate-800/60 border-slate-700'}`;
                btn.innerHTML = `
                    <div class="w-5 h-5 rounded-full border border-white/40 shadow" style="background-color: ${c.hex}"></div>
                    <span class="text-[9px] text-slate-300 mt-0.5">${c.name}</span>
                `;
                btn.onclick = () => {
                    state.selectedColor = c.hex;
                    state.selectedColorName = c.name;
                    document.getElementById('selected-color-name').innerText = c.name;
                    initIdolColorPaletteUI();
                };
                picker.appendChild(btn);
            });
        }

        function renderQuickSelectModalUI() {
            const listEl = document.getElementById('quick-select-list');
            listEl.innerHTML = '';

            if (state.members.length === 0) {
                listEl.innerHTML = `<div class="text-xs text-slate-400 text-center py-4">メンバーが登録されていません</div>`;
                return;
            }

            state.members.forEach(m => {
                const isSelected = (m.id === state.selectedMemberId);
                const item = document.createElement('button');
                item.className = `w-full text-left p-2.5 rounded-xl border flex items-center justify-between transition ${isSelected ? 'bg-pink-950/40 border-pink-500/80 text-white' : 'bg-slate-800/60 border-slate-700/80 text-slate-300 hover:bg-slate-700'}`;
                item.innerHTML = `
                    <div class="flex items-center space-x-2.5 overflow-hidden">
                        <div class="w-4 h-4 rounded-full border border-slate-600 flex-shrink-0" style="background-color: ${m.color};"></div>
                        <div class="truncate">
                            <span class="text-[9px] text-slate-400 block truncate">${m.groupName}</span>
                            <span class="text-xs font-bold truncate">${m.memberName}</span>
                        </div>
                    </div>
                    ${isSelected ? '<i class="fa-solid fa-check text-pink-400 text-xs"></i>' : ''}
                `;
                item.onclick = () => {
                    state.selectedMemberId = m.id;
                    updateIdolBadgeUI();
                    document.getElementById('modal-quick-select').classList.add('hidden');
                };
                listEl.appendChild(item);
            });
        }

        function renderSettingsModalUI() {
            const selectGroup = document.getElementById('select-group');
            const groups = [...new Set(state.members.map(m => m.groupName))];
            selectGroup.innerHTML = '';
            groups.forEach(g => {
                const opt = document.createElement('option');
                opt.value = g;
                opt.innerText = g;
                selectGroup.appendChild(opt);
            });

            const listContainer = document.getElementById('settings-member-list');
            listContainer.innerHTML = '';

            state.members.forEach(m => {
                const row = document.createElement('div');
                row.className = `flex items-center justify-between p-2 rounded-xl border ${m.id === state.selectedMemberId ? 'bg-pink-950/30 border-pink-500/50' : 'bg-slate-800/40 border-slate-700/60'}`;
                row.innerHTML = `
                    <div class="flex items-center space-x-2 overflow-hidden">
                        <div class="w-4 h-4 rounded-full border border-slate-600 flex-shrink-0" style="background-color: ${m.color};"></div>
                        <div class="truncate">
                            <span class="text-[9px] text-slate-400 block truncate">${m.groupName}</span>
                            <span class="text-xs font-bold text-slate-200 truncate">${m.memberName}</span>
                        </div>
                    </div>
                    <div class="flex items-center space-x-1 flex-shrink-0">
                        <button data-id="${m.id}" class="btn-select-mem px-2 py-1 rounded bg-slate-700 hover:bg-slate-600 text-[10px] text-slate-200 transition">選択</button>
                        <button data-id="${m.id}" class="btn-edit-mem p-1.5 rounded bg-slate-700 hover:bg-slate-600 text-[10px] text-slate-300 transition"><i class="fa-solid fa-pen"></i></button>
                        <button data-id="${m.id}" class="btn-delete-mem p-1.5 rounded bg-rose-900/40 hover:bg-rose-900/60 text-[10px] text-rose-300 transition"><i class="fa-solid fa-trash"></i></button>
                    </div>
                `;
                listContainer.appendChild(row);
            });

            listContainer.querySelectorAll('.btn-select-mem').forEach(btn => {
                btn.onclick = () => {
                    state.selectedMemberId = btn.dataset.id;
                    updateIdolBadgeUI();
                    renderSettingsModalUI();
                };
            });

            listContainer.querySelectorAll('.btn-edit-mem').forEach(btn => {
                btn.onclick = () => {
                    const id = btn.dataset.id;
                    const target = state.members.find(m => m.id === id);
                    if (!target) return;

                    document.getElementById('edit-member-id').value = target.id;
                    document.getElementById('input-member-name').value = target.memberName;
                    
                    selectGroup.value = target.groupName;
                    state.isCreatingNewGroup = false;
                    document.getElementById('input-new-group-name').classList.add('hidden');
                    selectGroup.classList.remove('hidden');
                    document.getElementById('btn-toggle-new-group').innerText = '+ 新規';

                    state.selectedColor = target.color;
                    const matchedColor = IDOL_COLORS.find(c => c.hex.toLowerCase() === target.color.toLowerCase());
                    state.selectedColorName = matchedColor ? matchedColor.name : 'カスタム';
                    document.getElementById('selected-color-name').innerText = state.selectedColorName;
                    initIdolColorPaletteUI();

                    document.getElementById('form-mode-title').innerText = 'メンバー情報編集';
                    document.getElementById('btn-save-member').innerText = '更新する';
                };
            });

            listContainer.querySelectorAll('.btn-delete-mem').forEach(btn => {
                btn.onclick = () => {
                    const id = btn.dataset.id;
                    if (state.members.length <= 1) return;
                    state.members = state.members.filter(m => m.id !== id);
                    if (state.selectedMemberId === id) {
                        state.selectedMemberId = state.members[0].id;
                    }
                    saveMembersToStorage();
                    updateIdolBadgeUI();
                    renderSettingsModalUI();
                };
            });
        }

        function saveMemberFromForm() {
            const editId = document.getElementById('edit-member-id').value;
            const memberName = document.getElementById('input-member-name').value.trim();
            if (!memberName) return;

            let groupName = '';
            if (state.isCreatingNewGroup) {
                groupName = document.getElementById('input-new-group-name').value.trim() || 'その他グループ';
            } else {
                groupName = document.getElementById('select-group').value;
            }

            if (editId) {
                const target = state.members.find(m => m.id === editId);
                if (target) {
                    target.groupName = groupName;
                    target.memberName = memberName;
                    target.color = state.selectedColor;
                }
            } else {
                const newMember = {
                    id: 'mem_' + Date.now(),
                    groupName: groupName,
                    memberName: memberName,
                    color: state.selectedColor
                };
                state.members.push(newMember);
                state.selectedMemberId = newMember.id;
            }

            saveMembersToStorage();
            updateIdolBadgeUI();
            resetMemberForm();
            renderSettingsModalUI();
        }

        function resetMemberForm() {
            document.getElementById('edit-member-id').value = '';
            document.getElementById('input-member-name').value = '';
            document.getElementById('input-new-group-name').value = '';
            state.isCreatingNewGroup = false;
            document.getElementById('input-new-group-name').classList.add('hidden');
            document.getElementById('select-group').classList.remove('hidden');
            document.getElementById('btn-toggle-new-group').innerText = '+ 新規';
            document.getElementById('form-mode-title').innerText = '推しメンバー追加';
            document.getElementById('btn-save-member').innerText = 'メンバーを追加する';
            
            state.selectedColor = '#FFFFFF';
            state.selectedColorName = '白';
            document.getElementById('selected-color-name').innerText = '白';
            initIdolColorPaletteUI();
        }
    </script>
</body>
</html>
